name: Diagnosticar RH Render
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/diagnosticar-rh-render.yml']
permissions: {contents: read}
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Diferenciar API direta e proxy
        run: |
          python - <<'PY'
          import urllib.request,urllib.error,json,time
          targets=[
          ('API /health','https://vico-gov-api-vicosa.onrender.com/health'),
          ('API /resumo','https://vico-gov-api-vicosa.onrender.com/api/v1/rh/folha/resumo?mes=2026-01'),
          ('WEB proxy /resumo','https://vico-gov-web-vicosa.onrender.com/api/municipal/api/v1/rh/folha/resumo?mes=2026-01'),
          ('WEB proxy /filtros','https://vico-gov-web-vicosa.onrender.com/api/municipal/api/v1/rh/folha/filtros?mes=2026-01')]
          for name,url in targets:
              t=time.monotonic()
              try:
                  req=urllib.request.Request(url,headers={'User-Agent':'VicoGov-Diagnostics/1.0'})
                  with urllib.request.urlopen(req,timeout=125) as r:
                      d=r.read(6000).decode()
                      print(name,'HTTP',r.status,'seconds',round(time.monotonic()-t,1),'body',d[:300])
              except urllib.error.HTTPError as e:
                  print(name,'HTTP',e.code,'seconds',round(time.monotonic()-t,1),'body',e.read(600).decode(errors='replace'))
              except Exception as e:
                  print(name,'ERROR',type(e).__name__,str(e)[:250], 'seconds',round(time.monotonic()-t,1))
          PY
