name: Testar painel RH janeiro-julho em produção
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/testar-painel-rh-2026.yml'
permissions: {contents: read}
jobs:
  verificacao:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Testar API real com os sete meses
        run: |
          python - <<'PY'
          import json,urllib.request,urllib.error,time
          base='https://vico-gov-web-vicosa.onrender.com/api/rh/painel'
          def get(query):
              req=urllib.request.Request(base+query,headers={'User-Agent':'VIÇO GOV RH QA'})
              for attempt in range(4):
                  try:
                      with urllib.request.urlopen(req,timeout=120) as res:
                          obj=json.load(res)
                          print('HTTP',res.status,query,flush=True)
                          return obj
                  except Exception as e:
                      print(type(e).__name__,str(e)[:140],flush=True)
                      if attempt==3:raise
                      time.sleep(7)
          all_months=','.join(f'2026-{i:02}' for i in range(1,8))
          result=get('?meses='+all_months)
          assert result['cobertura']==7,result.get('cobertura')
          assert len(result['competencias'])==7
          assert all(m['disponivel'] for m in result['competencias'])
          expected={2:12300406.77,3:12222056.72,4:12360294.80,5:12091339.79,6:12715794.62,7:16476247.84}
          for month,gross in expected.items():
              item=result['competencias'][month-1]
              assert abs(item['indicadores']['bruto']-gross)<0.05,(month,item)
          salarios=result['maiores_salarios']
          assert len(salarios)>3
          assert all(salarios[i]['media_bruta']>=salarios[i+1]['media_bruta'] for i in range(len(salarios)-1))
          assert result['por_departamento'] and result['por_cargo'] and result['pessoas']
          jul=get('?meses=2026-07')
          assert jul['totais']['vinculos_mes']==2422,jul['totais']
          assert abs(jul['totais']['bruto']-16476247.84)<0.05
          print('OK sete meses, totais e ordenacao de salarios; julho nao duplica inclusoes.')
          print('SUCESSO painel RH em producao.')
          PY
