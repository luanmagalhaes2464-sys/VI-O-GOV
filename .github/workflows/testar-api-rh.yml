name: Testar API RH em producao
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/testar-api-rh.yml']
permissions:
  contents: read
jobs:
  api:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Consultar endpoint publico VIÇO GOV
        run: |
          python - <<'PY'
          import urllib.request, json
          url='https://vico-gov-web-vicosa.onrender.com/api/rh/ibge'
          req=urllib.request.Request(url,headers={'User-Agent':'VicoGov-Monitor/1.0'})
          with urllib.request.urlopen(req,timeout=130) as r:
              print('HTTP',r.status)
              d=json.load(r)
          assert d['codigo_ibge']=='3171303',d.get('codigo_ibge')
          assert d['ano']==2023
          assert d['total']==1886
          assert d['origens'][0]['total']==1526
          assert d['origens'][1]['total']==360
          print('OK município:',d['municipio'],'pessoal:',d['total'],'origem:',d['modo'])
          PY
