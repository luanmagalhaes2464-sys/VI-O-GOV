name: Diagnostico portal RH via HTTP publico
on:
  push:
    branches: [investigacao-api-rh-2026]
    paths:
      - '.github/workflows/probe-portal-rh.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnostico:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verificar acesso publico sem baixar dados pessoais
        run: |
          python - <<'PY'
          import urllib.request,urllib.error,re,time
          urls=[
           'https://pmvicosa.cidadesmg.com.br/portaltransparencia/',
           'https://pmvicosa.cidadesmg.com.br/portaltransparencia/index.xhtml',
           'https://pmvicosa.cidadesmg.com.br/portaltransparencia/publica/recursosHumanos/recursosHumanos.xhtml',
           'https://pmvicosa.cidadesmg.com.br/robots.txt',
          ]
          for url in urls:
            started=time.monotonic()
            print('\nTEST:',url.rsplit('/',1)[-1],flush=True)
            try:
              req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0','Accept':'text/html,application/xhtml+xml,*/*'})
              with urllib.request.urlopen(req,timeout=25) as r:
                s=r.read(800000).decode('utf-8','replace')
                print('HTTP',r.status,'Finalhost:',r.url.split('/')[2],'Time:',round(time.monotonic()-started,2),'Type:',r.headers.get('Content-Type'),'Server:',r.headers.get('Server'),flush=True)
                print('HTML indicators: viewstate=',bool(re.search('javax.faces.ViewState',s)),'primefaces=',('PrimeFaces' in s),'form=',bool(re.search(r'<form',s,re.I)),'jsessionid=',('jsessionid' in r.url),'exportJSON=',('Exportar JSON' in s),flush=True)
                if 'javax.faces.ViewState' in s:
                  print('JSF viewstate present; no request bodies logged',flush=True)
                print('Scripts referenced:',len(re.findall(r'<script\\b[^>]*src=',s,re.I)),flush=True)
            except urllib.error.HTTPError as e:
              raw=e.read(1000).decode('utf-8','replace')
              print('HTTP',e.code,'Time:',round(time.monotonic()-started,2),'Server:',e.headers.get('Server'),'Content-type:',e.headers.get('Content-Type'),'Body preview:',re.sub(r'\\s+',' ',re.sub('<[^>]+>','',raw))[:160],flush=True)
            except Exception as e:
              print('EXCEPTION',type(e).__name__,str(e)[:150],flush=True)
          PY
