name: Validar gráficos clicáveis de RH em produção
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/testar-rh-graficos.yml'
permissions:
  contents: read
jobs:
  checar:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Consultar departamentos, cargos e rubricas reais de janeiro e julho
        run: |
          python - <<'PY'
          import urllib.request, urllib.error,urllib.parse,json,time,math
          root='https://vico-gov-web-vicosa.onrender.com'
          def fetch(path,args):
              url=root+path+'?'+urllib.parse.urlencode(args)
              for attempt in range(4):
                  try:
                      req=urllib.request.Request(url,headers={'User-Agent':'VicoGov-ChartTest/1.0'})
                      with urllib.request.urlopen(req,timeout=120) as r:
                          assert r.status==200,(path,r.status)
                          return json.load(r)
                  except Exception as ex:
                      if attempt==3:
                          if isinstance(ex,urllib.error.HTTPError):
                              print('HTTP',ex.code,ex.read(900).decode(errors='replace'))
                          raise
                      time.sleep(4)
          jan=fetch('/api/rh/painel',{'meses':'2026-01'})
          sector=jan['por_departamento'][0]
          amount=float(sector['bruto'])
          assert sector['quantidade']>0 and amount>0
          dept=fetch('/api/rh/explorar',{'modo':'departamento','valor':sector['nome'],'meses':'2026-01'})
          assert dept['resumo']['vinculos_mes']==sector['quantidade']
          assert abs(float(dept['resumo']['bruto'])-amount)<.02
          print('OK setor: quantidade, percentual calculável e gasto bruto conciliados')
          cargo=jan['por_cargo'][0]
          group=fetch('/api/rh/explorar',{'modo':'cargo','valor':cargo['nome'],'meses':'2026-01'})
          assert group['resumo']['vinculos_mes']==cargo['quantidade']
          assert abs(float(group['resumo']['bruto'])-float(cargo['bruto']))<.02
          assert len(group['pessoas'])>0
          p=group['pessoas'][0]
          detail=fetch('/api/rh/explorar',{'modo':'pessoa','id':p['id']})
          assert detail['pessoa']['matricula']==p['matricula']
          assert len(detail['inclusoes'])>=1
          bruto=sum(float(x['bruto']) for x in detail['inclusoes'])
          assert abs(bruto-float(detail['pessoa']['bruto']))<.03,(bruto,detail['pessoa']['bruto'])
          assert sum(len(x['rubricas']) for x in detail['inclusoes'])>=2
          print('OK cargo: gasto e lista individual; rubricas conciliadas por matrícula')
          jul=fetch('/api/rh/painel',{'meses':'2026-07'})
          high=jul['maiores_salarios'][0]
          latest=fetch('/api/rh/explorar',{'modo':'cargo','valor':high['nome'],'meses':'2026-07'})
          assert len(latest['pessoas'])>0
          d=fetch('/api/rh/explorar',{'modo':'pessoa','id':latest['pessoas'][0]['id']})
          assert len(d['inclusoes'])>0
          assert any(r.get('tipo') in ('PROVENTO','DESCONTO') for inc in d['inclusoes'] for r in inc['rubricas'])
          print('OK maiores salários julho: pessoa e rubricas reais disponíveis')
          combined=fetch('/api/rh/explorar',{'modo':'cargo','valor':high['nome'],'meses':'2026-01,2026-07'})
          assert combined['resumo']['vinculos_mes']>=latest['resumo']['vinculos_mes']
          print('SUCESSO: gráficos detalhados e multimeses consultados na API publicada')
          PY
